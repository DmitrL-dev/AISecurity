global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'sentinel-shield'
    static_configs:
      - targets: ['shield-api:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'sentinel-core'
    static_configs:
      - targets: ['sentinel-core:50051']
    scrape_interval: 30s
