# SENTINEL Shield — Standalone Docker Compose
# Run: docker-compose up -d

services:
  shield:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinel/shield:1.2.0
    container_name: sentinel-shield
    restart: unless-stopped
    ports:
      - "${SHIELD_API_PORT:-8081}:8081"
      - "${SHIELD_METRICS_PORT:-9090}:9090"
    environment:
      - SHIELD_LOG_LEVEL=${SHIELD_LOG_LEVEL:-info}
      # Brain integration (uses Docker network name)
      - BRAIN_URL=${BRAIN_URL:-http://sentinel-community:8000}
    networks:
      - default
      - sentinel-network  # Connect to Brain's network
    volumes:
      - ./config:/etc/shield:ro
      - shield-logs:/var/log/shield
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  shield-logs:

networks:
  default:
  sentinel-network:
    external: true  # Use existing network created by Brain
