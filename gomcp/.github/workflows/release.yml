name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Run tests
        run: go test -v ./...

      - name: Build binaries
        run: |
          mkdir -p dist

          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -o dist/gomcp-server-linux-amd64 ./cmd/gomcp-server

          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -o dist/gomcp-server-linux-arm64 ./cmd/gomcp-server

          # macOS amd64
          GOOS=darwin GOARCH=amd64 go build -o dist/gomcp-server-darwin-amd64 ./cmd/gomcp-server

          # macOS arm64
          GOOS=darwin GOARCH=arm64 go build -o dist/gomcp-server-darwin-arm64 ./cmd/gomcp-server

          # Windows
          GOOS=windows GOARCH=amd64 go build -o dist/gomcp-server-windows-amd64.exe ./cmd/gomcp-server

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
