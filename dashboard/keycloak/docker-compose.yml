# SENTINEL Keycloak Authentication Server
# Development configuration

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: sentinel-keycloak
    command: start-dev --import-realm
    environment:
      # Admin credentials
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD:-sentinel-admin-dev}
      
      # Database connection
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD:-keycloak-db-dev}
      
      # Hostname settings
      - KC_HOSTNAME=${KC_HOSTNAME:-localhost}
      - KC_HOSTNAME_PORT=8081
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      
      # Health endpoint
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      
      # Proxy settings (for reverse proxy)
      - KC_PROXY=edge
      
    ports:
      - "8081:8080"
    volumes:
      - ./realm-sentinel.json:/opt/keycloak/data/import/realm-sentinel.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - sentinel-auth

  postgres:
    image: postgres:16-alpine
    container_name: sentinel-keycloak-db
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-keycloak-db-dev}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-auth

networks:
  sentinel-auth:
    driver: bridge

volumes:
  keycloak_postgres_data:
