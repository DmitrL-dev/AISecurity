<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380">
  <title>SENTINEL Guard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <svg class="header-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <div>
        <h1 class="header-title">SENTINEL Guard</h1>
        <p class="header-subtitle">AI Firewall</p>
      </div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="enableToggle" checked>
      <span class="toggle-slider"></span>
    </label>
  </header>

  <!-- Status Card -->
  <div class="status-card" id="statusCard">
    <div class="status-icon" id="statusIcon">🛡️</div>
    <div class="status-text" id="statusText">Protection Active</div>
    <div class="status-detail" id="statusDetail">Monitoring your AI conversations</div>
  </div>

  <!-- Stats Grid -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value" id="totalScans">0</div>
      <div class="stat-label">Scans</div>
    </div>
    <div class="stat-card stat-blocked">
      <div class="stat-value" id="totalBlocked">0</div>
      <div class="stat-label">Blocked</div>
    </div>
    <div class="stat-card stat-warned">
      <div class="stat-value" id="totalWarned">0</div>
      <div class="stat-label">Warnings</div>
    </div>
    <div class="stat-card stat-safe">
      <div class="stat-value" id="totalSafe">0</div>
      <div class="stat-label">Safe</div>
    </div>
  </div>

  <!-- Last Scan -->
  <div class="last-scan" id="lastScan" style="display:none">
    <div class="last-scan-header">Last Scan</div>
    <div class="last-scan-result" id="lastScanResult"></div>
  </div>

  <!-- Settings -->
  <div class="settings">
    <div class="setting-row">
      <label for="autoScan">Auto-scan prompts</label>
      <label class="toggle toggle-sm">
        <input type="checkbox" id="autoScan" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="setting-row">
      <label for="sensitivity">Sensitivity</label>
      <select id="sensitivity">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
    </div>
    <div class="setting-row">
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="sk-sentinel-..." class="input-api">
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <a href="https://sentinel.dev" target="_blank">sentinel.dev</a>
    <span>v0.1.0</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
