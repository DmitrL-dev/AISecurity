# Filename retained for workflow continuity; this is not AgenticRed.
name: Public Core and Guard Lab Regressions

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agentic-red.yml'
      - '.github/scripts/public_regressions.py'
      - '.github/tests/test_public_regressions.py'
      - 'sentinel-core/**'
      - 'tools/guard-lab/**'

permissions:
  contents: read

concurrency:
  group: public-regressions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-regressions:
    name: CPU native regressions (not a security benchmark)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      RAYON_NUM_THREADS: '1'
      RUSTUP_TOOLCHAIN: '1.88.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Initialize incomplete receipt
        run: python .github/scripts/public_regressions.py --initialize

      - name: Test gate failure controls
        run: python -m unittest discover -s .github/tests -p test_public_regressions.py -v

      - name: Prove missing dependencies cannot pass
        run: |
          python -m venv .missing-core-control
          status=0
          .missing-core-control/bin/python .github/scripts/public_regressions.py || status=$?
          test "$status" -eq 2
          python -c 'import json; from pathlib import Path; p = Path(".public-regression-reports/result.json"); r = json.loads(p.read_text()); assert r["status"] == "INCOMPLETE" and r["reason"] == "RUNNER_ERROR"; assert "core" not in r and "guard_lab" not in r; p.replace(p.with_name("missing-core.json"))'
          python .github/scripts/public_regressions.py --initialize

      - name: Set up pinned Rust
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install Guard Lab and its pinned public core
        timeout-minutes: 25
        working-directory: tools/guard-lab
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install 'pip==26.2.1'
          .venv/bin/python -m pip install .
          .venv/bin/python -m pip install --build-constraint build-constraints.txt -r requirements-core.txt
          .venv/bin/python -m pip check

      - name: Run all native regression cases and Guard Lab tests
        timeout-minutes: 8
        run: |
          tools/guard-lab/.venv/bin/python .github/scripts/public_regressions.py

      - name: Upload content-free receipt even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .public-regression-reports/result.json
            .public-regression-reports/missing-core.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
