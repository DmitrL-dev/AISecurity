name: eval-bounds

on:
  push:
    branches: [main]
    paths: ["tools/eval-bounds/**", ".github/workflows/eval-bounds.yml"]
  pull_request:
    paths: ["tools/eval-bounds/**", ".github/workflows/eval-bounds.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version the README promises and a current one; standard library only.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/eval-bounds
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No continue-on-error: a bound that is wrong must turn this red.
      - run: python -m unittest discover -s tools/eval-bounds -p 'test_*.py' -v
