    lang: zh
    description: "Explicit censorship bypass requests"

  # ============================================================
  # 3. Unicode Obfuscation Attacks
  # ============================================================
  # CJK characters have many lookalike variants
  
  - id: CJK-020
    name: "Fullwidth Latin Obfuscation"
    pattern_type: regex
    pattern: "[Ａ-Ｚａ-ｚ０-９]{3,}"
    severity: 0.70
    category: injection
    lang: multi
    description: "Fullwidth Latin characters used to evade English-language filters"
    
  - id: CJK-021
    name: "CJK Compatibility Characters"
    pattern_type: regex
    pattern: "[㍘-㏿]{2,}|[㈀-㋿]{2,}"
    severity: 0.65
    category: injection
    lang: multi
    description: "CJK compatibility ideographs used for obfuscation"
    
  - id: CJK-022
    name: "Mixed Script Injection"
    pattern_type: regex
    pattern: "(?:[\u4e00-\u9fff].*(?:ignore|forget|override|bypass))|(?:(?:ignore|forget|override|bypass).*[\u4e00-\u9fff])"
    severity: 0.80
    category: injection
    lang: multi
    description: "Mixed Chinese-English injection attempting to bypass language-specific filters"

  - id: CJK-023
    name: "Homoglyph Substitution (CJK)"
    pattern_type: regex
    pattern: "[一丨丶丿乀乁乂乃].*(?:密码|密钥|system|prompt|ignore)"
    severity: 0.70
